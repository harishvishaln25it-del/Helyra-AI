version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: helyra-postgres
    restart: always
    environment:
      POSTGRES_USER: helyra_user
      POSTGRES_PASSWORD: helyra_secure_password_2026
      POSTGRES_DB: helyra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helyra_user -d helyra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
